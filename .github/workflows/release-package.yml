name: node-mac-virtual-display Package

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm (OIDC trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:ts
      # The runner is arm64; prebuildify cross-compiles the x64 slice with
      # node-gyp --arch. Both land in prebuilds/ and ship in the tarball, so
      # consumers pick the right one at runtime instead of compiling.
      - run: npm run build:prebuilds
      - name: Run validation tests without creating displays
        run: npm test
      - name: Pack and validate the release artifact
        id: package
        run: |
          set -euo pipefail
          node -e 'require("node:assert/strict").equal(process.env.GITHUB_REF_NAME, `v${require("./package.json").version}`)'
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          task_archive="$RUNNER_TEMP/$(node -p 'const p = require("./package.json"); `${p.name}-${p.version}.tgz`')"
          npm run test:package -- "$task_archive"
          printf 'tarball=%s\n' "$task_archive" >> "$GITHUB_OUTPUT"
      - name: Publish the verified artifact
        run: npm publish --provenance --access public "${{ steps.package.outputs.tarball }}"
