name: node-mac-virtual-display Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm (OIDC trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:ts
      # The runner is arm64; prebuildify cross-compiles the x64 slice with
      # node-gyp --arch. Both land in prebuilds/ and ship in the tarball, so
      # consumers pick the right one at runtime instead of compiling.
      - run: npm run build:prebuilds
      - name: Run validation tests without creating displays
        run: npm test
      - name: Verify prebuild architectures
        run: |
          set -euo pipefail
          for pair in darwin-x64:x86_64 darwin-arm64:arm64; do
            dir="${pair%%:*}"; want="${pair##*:}"
            file="$(ls prebuilds/$dir/*.node)"
            have="$(lipo -archs "$file")"
            echo "$file -> $have"
            [ "$have" = "$want" ] || { echo "::error::$file is $have, expected $want"; exit 1; }
          done
      - run: npm publish --provenance --access public
